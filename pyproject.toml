[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumopt-explorer"
version = "2.0.0"
description = "Auditable benchmark for query-efficient robust calibration of a heralded photonic CNOT"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "MIT"}
authors = [{name = "Haoming Chen"}]
dependencies = [
  "matplotlib==3.10.5",
  "numpy==2.5.2",
  "perceval-quandela==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "reportlab==4.4.9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
